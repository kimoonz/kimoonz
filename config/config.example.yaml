# paradogo 설정 예시
#   cp config/config.example.yaml config/config.yaml
# 비밀번호·토큰은 파일에 직접 쓰지 말고 ${ENV_VAR} 로 두고 환경변수에 넣으세요.

site:
  # 파라다이스 스파 도고 공식 홈페이지. 제휴/재판매 사이트가 아니라 여기서 예약합니다.
  base_url: "https://www.paradisespa.co.kr"
  # ⚠️ 아래 두 경로는 실제 사이트를 열어 주소창을 보고 채워야 합니다.
  #    `python -m paradogo discover --interactive` 로 확인하면 편합니다.
  login_path: "/member/login"
  booking_path: "/reservation/cabin"
  timezone: "Asia/Seoul"

account:
  login_id: "${PARADOGO_ID}"
  password: "${PARADOGO_PW}"
  # 로그인 계정에 이미 저장돼 자동 입력되면 아래는 비워도 됩니다.
  booker:
    name: "홍길동"
    phone: "010-1234-5678"
    email: "you@example.com"

target:
  # 잡고 싶은 체크인 날짜. 위에서부터 우선순위 순으로 시도합니다.
  check_in_dates:
    - "2026-10-03"
    - "2026-10-04"
  # 몇 박으로 잡을지. 우선순위 순서로 적으면 위에서부터 시도합니다.
  # 예) [2, 1] = 2박을 먼저 노리고, 안 되면 1박
  nights_options: [1]

  # 희망 캐빈 이름(부분 일치). 비워두면 예약 가능한 아무 캐빈이나 잡습니다.
  cabin_types:
    - "캐빈"

  # 구역 A~H. 우선순위 순서. 비워두면 구역을 따지지 않습니다.
  zones: []            # 예: ["C", "D"]  → C구역 먼저, 없으면 D구역
  exclude_zones: []    # 예: ["A"]       → A구역은 절대 안 잡음
  # 구역 표기가 특이하면 직접 정규식을 주세요(캡처 그룹 1번이 구역).
  # 기본값으로 'A구역' '구역 A' 'A존' 'A동' 'A-03' '캐빈 A' 를 인식합니다.
  zone_pattern: ""     # 예: "SITE-([A-H])-\\d+"
  # true 면 구역을 못 읽은 캐빈은 예약 후보에서 뺍니다(엉뚱한 구역 예약 방지).
  # 알림은 그대로 옵니다 — 취소 자체를 놓치지는 않습니다.
  zone_strict: true

  adults: 2
  children: 0

run:
  headless: false          # 결제는 사람이 해야 하므로 창을 띄우는 것을 권장
  slow_mo_ms: 0
  dry_run: true            # 익숙해지기 전까지는 true 로 두세요(예약 버튼을 누르지 않음)
  keep_open_minutes: 30    # 결제 페이지 도달 후 브라우저를 열어두는 시간
  storage_state: ".state/session.json"
  artifacts_dir: ".artifacts"

  # 캐빈파크는 매달 1일 09:00(KST)에 다음 달 예약이 열립니다.
  open_time:
    day_of_month: 1
    hour: 9
    minute: 0
    lead_seconds: 30       # 오픈 몇 초 전에 세션을 되살릴지
    max_attempts: 40       # 오픈 후 재시도 횟수 (상한 120)
    attempt_interval_ms: 700   # 재시도 간격 (하한 300ms)
    sync_clock: true       # 서버 Date 헤더로 로컬 시계 오차 보정

  # 실시간 재고 추적 (track) — 마감→예약가능 전환을 감지해 즉시 확보
  track:
    interval_seconds: 20     # 하한: API 경로 5초, 달력 DOM 경로 15초
    jitter_seconds: 3
    months_ahead: 2          # 이번 달 포함 몇 개월치를 추적할지
    auto_reserve: true       # 취소 감지 시 결제 직전까지 자동 진행
    notify_all_changes: false  # true 면 대상 외 날짜의 변화도 전부 알림
    reserve_cooldown_minutes: 10   # 같은 칸 재시도 최소 간격
    max_duration_minutes: 0  # 0 이면 무제한
    dashboard: true
    db_path: ".state/tracker.db"

  # 오픈런에서 놓쳤을 때 쓰는 단순 반복 확인 (track 이 있으면 보통 필요 없음)
  watch:
    interval_seconds: 60   # 하한 10초. 사이트 부담을 생각해 너무 짧게 두지 마세요.
    jitter_seconds: 15
    max_duration_minutes: 720
    auto_reserve: true     # false 면 발견 시 알림만 보내고 예약은 하지 않음

notify:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "${SMTP_USER}"
    password: "${SMTP_PASS}"      # Gmail 은 '앱 비밀번호'를 쓰세요
    sender: "${SMTP_USER}"
    recipients:
      - "you@example.com"

# 사이트가 쓰는 재고 조회 API. `python -m paradogo sniff` 로 찾아서 채웁니다.
# 비워두면 추적기가 달력 DOM을 읽는 방식으로 자동 폴백합니다(느리고 날짜 단위까지만).
api:
  enabled: false
  # {year} {month} {month02} {ym} {ym_dash} {first_day} {last_day} 를 쓸 수 있습니다.
  url: ""
  method: "GET"
  headers: {}
  items_path: ""        # 응답에서 목록이 있는 경로. 예: "data.list"
  date_field: "date"    # 날짜가 든 필드명, 또는 "{y}-{m}-{d}" 같은 조합 템플릿
  cabin_field: ""       # 비우면 날짜 단위로만 추적
  zone_field: ""        # 구역을 따로 주는 API 라면 그 필드명 (없으면 캐빈 이름에서 추출)
  remaining_field: ""   # 잔여 수량 필드. 있으면 0보다 클 때 예약가능으로 판정
  price_field: ""
  status_field: ""      # 잔여 수량 대신 상태 문자열을 주는 경우
  status_available_values: []   # 예: ["Y", "OPEN", "가능"]
