# 논리 이름 → 후보 셀렉터 목록. 위에서부터 순서대로 시도하고, 화면에 보이는 첫 후보를 씁니다.
# Playwright 셀렉터 문법을 그대로 쓸 수 있습니다: CSS, text=, role=, xpath= 등.
#
# ⚠️ 아래 값은 '흔한 패턴'을 넣은 출발점일 뿐, 실제 사이트에서 검증된 값이 아닙니다.
#    `python -m paradogo discover --interactive` 로 실제 후보를 뽑아 교체하세요.
#
# booking.day_cell 에는 아래 placeholder 를 쓸 수 있습니다:
#   {date}=2026-10-03  {year}=2026  {month}=10  {day}=03  {day_int}=3  {compact}=20261003

common:
  # 한국 예약 사이트 특유의 레이어 팝업 닫기 버튼들
  popup_close:
    - "text=오늘 하루 보지 않기"
    - "text=닫기"
    - ".layer-popup .btn-close"
    - "button.close"

login:
  id_input:
    - "#userId"
    - "input[name='userId']"
    - "input[name='memberId']"
    - "input[name='id']"
  pw_input:
    - "#userPw"
    - "input[name='userPw']"
    - "input[type='password']"
  submit:
    - "button[type='submit']"
    - "text=로그인"
    - ".btn-login"
  # 로그인 성공을 판정하는 표식. 로그인 상태에서만 보이는 것이어야 합니다.
  success_marker:
    - "text=로그아웃"
    - "text=마이페이지"
    - ".member-info"

booking:
  month_label:
    - ".calendar .month"
    - ".cal-tit"
    - "[data-month]"
  prev_month:
    - "text=이전달"
    - ".calendar .prev"
    - "button[aria-label*='이전']"
  next_month:
    - "text=다음달"
    - ".calendar .next"
    - "button[aria-label*='다음']"
  day_cell:
    - "[data-date='{date}']"
    - "td[data-day='{day}']"
    - ".calendar td:not(.disabled):has-text('{day_int}')"
  # --- 아래 3개는 `track` (재고 추적)이 달력을 통째로 읽을 때 씁니다 ---
  # 달력의 모든 날짜 칸을 한 번에 잡는 셀렉터. 하나씩 조회하면 한 달에 수십 초가 걸립니다.
  day_cell_all:
    - "[data-date]"
    - ".calendar td[data-date]"
    - ".calendar td"
  # 위 셀에서 날짜를 담고 있는 속성 이름
  day_date_attr:
    - "data-date"
  # 셀의 class/텍스트에 이 중 하나라도 있으면 마감으로 본다
  day_soldout_tokens:
    - "soldout"
    - "disabled"
    - "마감"
    - "예약불가"

  # 날짜 칸 '안'에서 찾는 매진 표식
  day_soldout_marker:
    - ".soldout"
    - ".disabled"
    - "text=마감"
  # --- 박수(1박/2박) 지정. 아래 3가지를 순서대로 시도합니다 ---
  # 1) 박수 선택 박스가 있으면 그것
  nights_select:
    - "select[name='nights']"
    - "select[name='night']"
  # 2) '{nights}박' 버튼이 있으면 그것
  nights_button:
    - "text={nights}박"
    - "button[data-nights='{nights}']"
  # 3) 둘 다 없으면 체크아웃 날짜 칸을 누릅니다(체크인+박수 일자).
  #    보통 day_cell 과 같은 셀렉터라 비워두면 day_cell 을 그대로 씁니다.
  checkout_cell: []

  # 날짜 선택 후 눌러야 하는 조회 버튼(없으면 비워두세요)
  search_button:
    - "text=조회하기"
    - "text=검색"
  # 캐빈 한 건에 해당하는 반복 카드
  room_card:
    - ".room-list li"
    - ".product-item"
    - "li.roomType"
  # 아래 4개는 room_card '안'에서 찾습니다.
  room_name:
    - ".room-name"
    - "h3"
    - ".tit"
  room_price:
    - ".price"
    - ".won"
  # 구역(A~H)을 따로 보여주는 요소가 있으면 지정하세요.
  # 비워두면 캐빈 이름에서 'A구역' 'A동' 'A-03' 같은 표기를 찾아 씁니다.
  room_zone:
    - ".zone"
    - ".area"
  room_soldout_marker:
    - "text=마감"
    - "text=예약불가"
    - ".soldout"
  room_reserve_button:
    - "text=예약하기"
    - "button.btn-reserve"
    - "a.reserve"

guest:
  name:
    - "#bookerName"
    - "input[name='bookerName']"
    - "input[name='name']"
  phone:
    - "#bookerTel"
    - "input[name='bookerTel']"
    - "input[name='hp']"
  email:
    - "#bookerEmail"
    - "input[name='email']"
  adults:
    - "input[name='adultCnt']"
    - "select[name='adult']"
  children:
    - "input[name='childCnt']"
    - "select[name='child']"
  agree_all:
    - "#agreeAll"
    - "text=전체 동의"
    - "input[name='agreeAll']"
  to_payment:
    - "text=결제하기"
    - "text=다음 단계"
    - "button.btn-payment"

payment:
  # 결제 페이지에 도달했음을 판정하는 표식. 이 표식이 보이면 봇은 멈춥니다.
  marker:
    - "text=결제수단"
    - "text=결제 수단"
    - "#payment"
    - ".payment-method"
